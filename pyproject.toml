[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecely"
version = "0.1.0"
description = "A Vim-first TUI for issue trees and numerical estimations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mecely contributors" }]
dependencies = ["textual>=1.0,<2", "rich>=13.3.3,<16"]

[project.urls]
Homepage = "https://github.com/gabs-acc/mecely"
Repository = "https://github.com/gabs-acc/mecely"
Issues = "https://github.com/gabs-acc/mecely/issues"

[project.optional-dependencies]
web = ["textual-serve>=1.1.3,<2"]
dev = ["ruff>=0.6,<1"]

[project.scripts]
mecely = "mecely.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mecely*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
